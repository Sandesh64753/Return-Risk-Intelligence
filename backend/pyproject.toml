[project]
name = "prduct-return-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vairagarsandesh45@gmail.com", email = "vairagarsandesh45@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.161.1",

    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "itsdangerous>=2.2.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
prduct-return-prediction = "prduct_return_prediction:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

